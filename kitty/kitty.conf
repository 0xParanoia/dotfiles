# =====================================================================
# --- 🎨 TEMA Y COLORES ---
# =====================================================================
include current-theme.conf

# Estilo de los URLs detectados
url_color #61afef
url_style curly

# =====================================================================
# --- 🔤 TIPOGRAFÍA ---
# =====================================================================
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Renderizar siempre ligaduras de código
disable_ligatures never

# =====================================================================
# --- 🪟 DISEÑO, ENTORNO Y TRANSPARENCIA ---
# =====================================================================

# Tamanio base
remember_window_size  no
initial_window_width  940
initial_window_height 600

# Opacidad base (requerida por Blur my Shell)
background_opacity 0.95

# Margen interno y estética minimalista
window_padding_width 12
hide_window_decorations yes

# Personalización del cursor
cursor_shape beam
cursor_beam_thickness 1.8

# Estilo moderno de la barra de pestañas (Tabs)
tab_bar_style powerline
inactive_tab_background #e06c75
active_tab_background #98c379
inactive_tab_foreground #000000
tab_bar_margin_color black

# =====================================================================
# --- 🏎️ RENDIMIENTO Y CALIDAD DE VIDA ---
# =====================================================================
repaint_delay 10
input_delay 3
sync_to_monitor yes

enable_audio_bell no
mouse_hide_wait 3.0
detect_urls yes
copy_on_select yes

# =====================================================================
# --- ⌨️ SHORTCUTS Y NAVEGACIÓN ---
# =====================================================================

# --- Control de Paneles Divididos (Splits) ---
# Abrir panel vertical (al lado) en la ruta actual
map ctrl+shift+enter launch --location=vsplit --cwd=current

# Abrir panel horizontal (abajo) en la ruta actual
map ctrl+shift+h launch --location=hsplit --cwd=current

# Cerrar el panel enfocado
map ctrl+shift+w close_window

# Moverse entre paneles usando Ctrl + Flechas (¡Súper cómodo!)
map ctrl+left neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up neighboring_window up
map ctrl+down neighboring_window down

# Redimensionar paneles con Ctrl + Shift + Flechas
map ctrl+shift+left  resize_window narrower 3
map ctrl+shift+right resize_window wider 3
map ctrl+shift+up    resize_window taller 3
map ctrl+shift+down  resize_window shorter 3

# Zoom: Maximizar / Restaurar un panel con Ctrl + Shift + Z
map ctrl+shift+z toggle_layout stack

# --- Control de Pestañas (Tabs) ---
# Nueva pestaña en la ruta actual
map ctrl+shift+t new_tab_with_cwd

# Renombrar pestaña activa con Ctrl + Shift + R
map ctrl+shift+r set_tab_title

# --- Múltiples Portapapeles (Buffers F1-F8) ---
# Buffer A
map f1 copy_to_buffer a
map f2 paste_from_buffer a

# Buffer B
map f3 copy_to_buffer b
map f4 paste_from_buffer b

# Buffer C
map f5 copy_to_buffer c
map f6 paste_from_buffer c

# Buffer D
map f7 copy_to_buffer d
map f8 paste_from_buffer d

# --- Navegación rápida de Pestañas (Alt + Número) ---
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
